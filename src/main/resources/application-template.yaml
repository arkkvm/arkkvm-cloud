server:
  port: 6612

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://127.0.0.1:3306/ark-kvm?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC"
    username: your_mysql_user
    password: your_mysql_password
  redis:
    database: 0
    host: 127.0.0.1
    password: your_redis_password
    port: 6379
    timeout: 30000
    lettuce:
      pool:
        max-active: 200
        max-wait: 10000ms
        max-idle: 10
        min-idle: 5

oauth2:
  google:
    client-id: your_google_client_id
    client-secret: your_google_client_secret
    redirect-uri: "{baseUrl}/oauth2/code/google"
    scope: openid email profile
    auth-uri: https://accounts.google.com/o/oauth2/v2/auth
    token-uri: https://oauth2.googleapis.com/token
    jwks-uri: https://www.googleapis.com/oauth2/v3/certs
  cookie:
    signing-key: replace_with_a_random_signing_key
    max-age: 86400
    secure: false

webrtc:
  cloudflare:
    turn-key-id: your_cloudflare_turn_key_id
    turn-key-api-token: your_cloudflare_turn_api_token
  iceServers: stun:stun.cloudflare.com:3478,stun:stun.l.google.com:19302,stun:stun1.l.google.com:5349

mybatis-plus:
  mapper-locations: classpath*:mybatis/**/*.xml

sa-token:
  jwt-secret-key: replace_with_a_random_jwt_secret
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  maxLoginCount: 1
  token-style: uuid
  is-log: true
  is-read-cookie: false
  tokenPrefix: Bearer
  logLevel: info

knife4j:
  enable: true
  setting:
    language: zh-CN

release:
  download-cdn: "https://your-download-cdn.example.com/"

sign:
  keystore:
    path: "file:/absolute/path/to/server.p12"
    password: your_keystore_password
